name: Build & Lint Validation

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: build-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    name: Lint & Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Next.js production build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: https://igaming-backend-dev.onrender.com
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://mock-ci-supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'mock-ci-anon-key-valid-length-1234567890' }}
