name: Render Free Tier Uptime Hook (100% Uptime)

on:
  schedule:
    # Runs every 10 minutes (Render free tier sleeps after 15 minutes of idle)
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: render-uptime-hook
  cancel-in-progress: true

jobs:
  heartbeat:
    name: Heartbeat Ping Render Free Tier
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Ping Frontend KeepAlive Endpoints (Dev & Prod)
        run: |
          for URL in "https://igaming-frontend-dev.onrender.com/api/keepalive" "https://igaming-frontend-3ljx.onrender.com/api/keepalive"; do
            echo "Pinging $URL..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "$URL" || echo "failed")
            echo "KeepAlive HTTP status for $URL: $STATUS"
          done

      - name: Ping Frontend Health Endpoints (Dev & Prod)
        run: |
          for URL in "https://igaming-frontend-dev.onrender.com/api/health" "https://igaming-frontend-3ljx.onrender.com/api/health"; do
            echo "Pinging $URL..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "$URL" || echo "failed")
            echo "Health HTTP status for $URL: $STATUS"
          done
