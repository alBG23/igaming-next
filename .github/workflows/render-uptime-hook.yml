name: Render Free Tier Uptime Hook (100% Uptime)

on:
  schedule:
    # Runs every 10 minutes (Render free tier sleeps after 15 minutes of idle)
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: render-uptime-hook
  cancel-in-progress: true

jobs:
  heartbeat:
    name: Heartbeat Ping Render Free Tier
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Ping Frontend KeepAlive Endpoint
        run: |
          echo "Pinging igaming-frontend-dev keepalive..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://igaming-frontend-dev.onrender.com/api/keepalive || echo "failed")
          echo "Frontend KeepAlive HTTP status: $STATUS"

      - name: Ping Frontend Health Endpoint
        run: |
          echo "Pinging igaming-frontend-dev health..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://igaming-frontend-dev.onrender.com/api/health || echo "failed")
          echo "Frontend Health HTTP status: $STATUS"
